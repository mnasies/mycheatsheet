[package]
name = "mycheatsheet"
version = "0.1.0"
edition = "2021"
authors = ["Mnasie"]
description = "Fast, offline cheatsheet reference for programming languages in terminal and browser"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
arboard = "3.4"
tiny_http = "0.12"
pulldown-cmark = "0.12"
open = "5.3"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[[bin]]
name = "mycheatsheet"
path = "src/main.rs"

[lib]
name = "mycheatsheet"
path = "src/lib.rs"
