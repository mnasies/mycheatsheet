[package]
name = "mycheatsheet"
version = "0.1.0"
edition = "2021"
authors = ["Mnasie"]
description = "Fast, offline cheatsheet reference for programming languages in terminal and browser"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "mycheatsheet"
path = "src/main.rs"

[lib]
name = "mycheatsheet"
path = "src/lib.rs"
